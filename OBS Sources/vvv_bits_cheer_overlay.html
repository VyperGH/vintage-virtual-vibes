<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VVV Bits Cheer Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden;
    }

    .vvv-card {
      width: 480px;
      background: #0d0d1a;
      border: 2px solid #cc44ff;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      box-shadow: 0 0 0 1px #ff00ff33, inset 0 0 40px #1a003355;
    }

    .scan-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(204,68,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(204,68,255,0.12) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }

    .top-bar {
      background: linear-gradient(90deg, #cc44ff, #ff44cc, #44ccff);
      height: 3px;
      width: 100%;
    }

    .corner-accent {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #ff44cc;
      border-style: solid;
      z-index: 5;
    }
    .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .content {
      position: relative;
      z-index: 2;
      padding: 20px 28px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .bits-gem {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      animation: gemPulse 1.6s ease-in-out infinite;
    }

    @keyframes gemPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #ff44cc) drop-shadow(0 0 18px #cc44ff88); transform: scale(1); }
      50%       { filter: drop-shadow(0 0 14px #ff44cc) drop-shadow(0 0 30px #cc44ffaa); transform: scale(1.07); }
    }

    .text-block { flex: 1; min-width: 0; }

    .cheer-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #ff44cc;
      text-transform: uppercase;
      margin: 0 0 4px;
      opacity: 0.85;
    }

    .username {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #e8d5ff;
      margin: 0 0 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 12px #cc44ff88;
    }

    .bits-amount {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #44ccff;
      margin: 0 0 6px;
      letter-spacing: 0.06em;
    }
    .bits-amount span { color: #ffdd44; font-size: 16px; }

    .message {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #b899dd;
      margin: 0;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.3s;
    }

    .bits-bar {
      position: relative;
      z-index: 2;
      margin: 0 28px 18px;
      height: 4px;
      background: #1a0033;
      border-radius: 2px;
      overflow: hidden;
    }

    .bits-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #cc44ff, #44ccff);
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bottom-tag {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-bottom: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: #cc44ff66;
      text-transform: uppercase;
    }

    .particles { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }
    @keyframes float {
      0%   { transform: translateY(100%) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      80%  { opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
    }

    /* Entry animation */
    .vvv-card {
      animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes slideIn {
      from { transform: translateX(-60px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
  </style>
</head>
<body>

<div class="vvv-card" id="card">
  <div class="top-bar"></div>
  <div class="grid-bg"></div>
  <div class="scan-lines"></div>
  <div class="corner-accent corner-tl"></div>
  <div class="corner-accent corner-tr"></div>
  <div class="corner-accent corner-bl"></div>
  <div class="corner-accent corner-br"></div>
  <div class="particles" id="particles"></div>

  <div class="content">
    <svg class="bits-gem" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="36,6 62,22 62,50 36,66 10,50 10,22" fill="#1a003a" stroke="#cc44ff" stroke-width="1.5"/>
      <polygon points="36,6 62,22 36,30" fill="#3a006a" opacity="0.9"/>
      <polygon points="36,6 10,22 36,30" fill="#2a0050" opacity="0.9"/>
      <polygon points="10,22 36,30 10,50" fill="#220044" opacity="0.85"/>
      <polygon points="62,22 62,50 36,30" fill="#440088" opacity="0.85"/>
      <polygon points="10,50 36,30 36,66" fill="#330066" opacity="0.9"/>
      <polygon points="62,50 36,66 36,30" fill="#550099" opacity="0.9"/>
      <polygon points="36,18 52,26 52,46 36,54 20,46 20,26" fill="none" stroke="#ff44cc" stroke-width="0.8" opacity="0.5"/>
      <circle cx="36" cy="36" r="4" fill="#ff44cc" opacity="0.7"/>
      <polygon points="36,6 62,22 62,50 36,66 10,50 10,22" fill="none" stroke="#cc44ff" stroke-width="1.5"/>
    </svg>

    <div class="text-block">
      <p class="cheer-label">Bits Cheer</p>
      <p class="username" id="uname">VaporWaveRider</p>
      <p class="bits-amount">Cheered <span id="amount">500</span> bits!</p>
      <p class="message" id="msg"></p>
    </div>
  </div>

  <div class="bits-bar"><div class="bits-bar-fill" id="bar" style="width: 0%;"></div></div>
  <div class="bottom-tag">Vintage Virtual Vibes</div>
</div>

<script>
  /*
   * ─────────────────────────────────────────────
   *  VVV Bits Cheer Overlay
   *
   *  USAGE IN STREAMLABS / STREAMELEMENTS:
   *  Pass cheer data via URL parameters:
   *    ?name=Username&amount=500
   *
   *  Or call window.triggerCheer(name, amount)
   *  from your alert widget JS.
   *
   *  OBS BROWSER SOURCE:
   *  Set width to 480, height to 140.
   *  Enable "Shutdown source when not visible"
   *  and "Refresh browser when scene becomes active"
   *  so the slide-in animation plays each time.
   * ─────────────────────────────────────────────
   */

  const MESSAGES = [
    "404: chill not found. sending bits instead.",
    "the vaporwave gods demand tribute 🌊",
    "insert coin to continue existing",
    "my wallet said no. my heart said yes.",
    "this is fine. everything is fine. cheer100",
    "caught in the grid. send help. and bits.",
    "retrowave activated. reality suspended.",
    "bits go brrr into the void",
    "i pressed the button and now we're here",
    "the synth said drop it. i dropped it.",
    "aesthetic maximum achieved ✦",
    "vibes transferred successfully",
    "WARNING: excessive coolness detected",
    "somewhere a palm tree nods in approval",
    "dial-up connecting to based dimension...",
    "your stream unlocked a memory I never had",
    "the grid calls. the bits answer.",
    "loading good vibes... ██████░░ 75%",
    "reality.exe has stopped responding",
    "this is peak timeline and I'm here for it",
    "rewinding the cassette of my soul",
    "time is a flat circle and so is this gem",
    "i don't know what year it is but I'm here",
    "static noise intensifies ~~~",
    "broadcasting from beyond the neon horizon",
  ];

  let lastIndex = -1;

  function pickMessage() {
    let idx;
    do { idx = Math.floor(Math.random() * MESSAGES.length); } while (idx === lastIndex);
    lastIndex = idx;
    return MESSAGES[idx];
  }

  function setMessage(text) {
    const el = document.getElementById('msg');
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = '"' + text + '"';
      el.style.opacity = 1;
    }, 200);
  }

  function spawnParticles() {
    const p = document.getElementById('particles');
    p.innerHTML = '';
    const colors = ['#ff44cc','#cc44ff','#44ccff','#ffdd44','#ff66aa'];
    for (let i = 0; i < 18; i++) {
      const dot = document.createElement('div');
      dot.className = 'particle';
      dot.style.cssText = [
        'left:'   + (10 + Math.random() * 80) + '%',
        'bottom:' + (Math.random() * 30) + '%',
        'background:' + colors[Math.floor(Math.random() * colors.length)],
        'animation-duration:' + (1.2 + Math.random() * 1.4) + 's',
        'animation-delay:'    + (Math.random() * 0.8) + 's',
        'width:'  + (2 + Math.random() * 4) + 'px',
        'height:' + (2 + Math.random() * 4) + 'px',
      ].join(';');
      p.appendChild(dot);
    }
  }

  function triggerCheer(name, amount) {
    document.getElementById('uname').textContent   = name || 'Anonymous';
    document.getElementById('amount').textContent  = (parseInt(amount) || 100).toLocaleString();
    const pct = Math.min(100, Math.max(8, Math.log10(Math.max(1, amount)) / Math.log10(1000000) * 100));
    document.getElementById('bar').style.width = pct.toFixed(1) + '%';
    setMessage(pickMessage());
    spawnParticles();
  }

  // Expose globally for alert widget integration
  window.triggerCheer = triggerCheer;

  // Read URL params (Streamlabs / StreamElements usage)
  const params  = new URLSearchParams(window.location.search);
  const urlName = params.get('name');
  const urlAmt  = params.get('amount');
  if (urlName || urlAmt) {
    triggerCheer(urlName || 'Anonymous', parseInt(urlAmt) || 100);
  } else {
    // Default preview state
    triggerCheer('VaporWaveRider', 500);
  }
</script>
</body>
</html>
