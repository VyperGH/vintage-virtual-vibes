<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VVV Alerts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    width: 480px;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Alert Card ─────────────────────────────────── */
  .alert-card {
    width: 480px;
    border-radius: 10px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.6) rotate(-2deg);
  }

  .alert-card.pop-in {
    animation: vvvPop 5s forwards ease-out;
  }

  @keyframes vvvPop {
    0%   { opacity: 0; transform: scale(0.6) rotate(-2deg); }
    8%   { opacity: 1; transform: scale(1.06) rotate(0.5deg); }
    14%  { transform: scale(0.97); }
    20%  { opacity: 1; transform: scale(1); }
    75%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.95); }
  }

  /* shimmer sweep */
  .alert-shimmer {
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    animation: shimmer 5s forwards;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { left: -60%; }
    28%  { left: 120%; }
    100% { left: 120%; }
  }

  /* glass overlay */
  .alert-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Typography ─────────────────────────────────── */
  .alert-icon {
    font-size: 42px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px currentColor);
  }

  .alert-body { flex: 1; min-width: 0; }

  .alert-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 3px;
    opacity: 0.85;
  }

  .alert-name {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 14px currentColor;
  }

  .alert-msg {
    font-family: 'VT323', monospace;
    font-size: 19px;
    margin-top: 2px;
    opacity: 0.85;
  }

  /* ── Event Themes ───────────────────────────────── */

  /* Follower — hot pink */
  .theme-follow {
    background: linear-gradient(135deg, #1a0026, #2d0040);
    border: 1.5px solid #ff79c6;
    box-shadow: 0 0 24px rgba(255, 121, 198, 0.25), inset 0 0 40px rgba(255, 121, 198, 0.04);
  }
  .theme-follow .alert-label,
  .theme-follow .alert-msg  { color: #ff79c6; }
  .theme-follow .alert-icon { color: #ff79c6; }
  .theme-follow .alert-name { color: #ffb3e6; text-shadow: 0 0 14px #ff79c6; }

  /* Sub — purple */
  .theme-sub {
    background: linear-gradient(135deg, #120025, #200040);
    border: 1.5px solid #bd93f9;
    box-shadow: 0 0 24px rgba(189, 147, 249, 0.25), inset 0 0 40px rgba(189, 147, 249, 0.04);
  }
  .theme-sub .alert-label,
  .theme-sub .alert-msg  { color: #bd93f9; }
  .theme-sub .alert-icon { color: #bd93f9; }
  .theme-sub .alert-name { color: #d6b8ff; text-shadow: 0 0 14px #bd93f9; }

  /* Resub — cyan */
  .theme-resub {
    background: linear-gradient(135deg, #001a26, #002a40);
    border: 1.5px solid #8be9fd;
    box-shadow: 0 0 24px rgba(139, 233, 253, 0.25), inset 0 0 40px rgba(139, 233, 253, 0.04);
  }
  .theme-resub .alert-label,
  .theme-resub .alert-msg  { color: #8be9fd; }
  .theme-resub .alert-icon { color: #8be9fd; }
  .theme-resub .alert-name { color: #b8f4ff; text-shadow: 0 0 14px #8be9fd; }

  /* Gift Sub — green */
  .theme-giftsub {
    background: linear-gradient(135deg, #001a10, #002a18);
    border: 1.5px solid #50fa7b;
    box-shadow: 0 0 24px rgba(80, 250, 123, 0.25), inset 0 0 40px rgba(80, 250, 123, 0.04);
  }
  .theme-giftsub .alert-label,
  .theme-giftsub .alert-msg  { color: #50fa7b; }
  .theme-giftsub .alert-icon { color: #50fa7b; }
  .theme-giftsub .alert-name { color: #a0ffb5; text-shadow: 0 0 14px #50fa7b; }

  /* Prime Sub — amber */
  .theme-prime {
    background: linear-gradient(135deg, #201000, #301800);
    border: 1.5px solid #ffb86c;
    box-shadow: 0 0 24px rgba(255, 184, 108, 0.25), inset 0 0 40px rgba(255, 184, 108, 0.04);
  }
  .theme-prime .alert-label,
  .theme-prime .alert-msg  { color: #ffb86c; }
  .theme-prime .alert-icon { color: #ffb86c; }
  .theme-prime .alert-name { color: #ffd9a8; text-shadow: 0 0 14px #ffb86c; }
</style>
</head>
<body>

<div class="alert-card" id="alertCard">
  <div class="alert-shimmer"></div>
  <div class="alert-icon" id="alertIcon"></div>
  <div class="alert-body">
    <div class="alert-label" id="alertLabel"></div>
    <div class="alert-name"  id="alertName"></div>
    <div class="alert-msg"   id="alertMsg"></div>
  </div>
</div>

<script>
  /* ── Streamlabs event listener ─────────────────────────────────────────── */

  const card    = document.getElementById('alertCard');
  const icon    = document.getElementById('alertIcon');
  const label   = document.getElementById('alertLabel');
  const name    = document.getElementById('alertName');
  const msg     = document.getElementById('alertMsg');

  /* Map Streamlabs event types → theme config */
  const themes = {
    follow:   { cls: 'theme-follow',   icon: '♡', label: 'New Follower'   },
    subscribe:{ cls: 'theme-sub',      icon: '★', label: 'New Subscriber' },
    resub:    { cls: 'theme-resub',    icon: '◈', label: 'Resubscribed'   },
    giftsub:  { cls: 'theme-giftsub',  icon: '◆', label: 'Gift Sub'       },
    primesub: { cls: 'theme-prime',    icon: '◉', label: 'Prime Sub'      },
  };

  /* Remove all theme classes */
  function clearThemes() {
    Object.values(themes).forEach(t => card.classList.remove(t.cls));
    card.classList.remove('pop-in');
  }

  /* Trigger an alert */
  function showAlert(type, username, extraMsg) {
    const t = themes[type];
    if (!t) return;

    clearThemes();

    /* Force reflow so animation retriggers */
    void card.offsetWidth;

    card.classList.add(t.cls, 'pop-in');
    icon.textContent  = t.icon;
    label.textContent = t.label;
    name.textContent  = username || 'Someone';
    msg.textContent   = extraMsg  || '';
  }

  /* ── Streamlabs socket/widget API ─────────────────────────────────────── */
  /* Streamlabs calls window.streamlabsOBS.onEventReceived with event data. */
  /* The widget API also fires a custom "onWidgetLoad" with test events.    */

  window.addEventListener('onEventReceived', function(obj) {
    const data = obj.detail;

    /* Follower */
    if (data.type === 'follow') {
      showAlert('follow', data.event.name, 'just followed the stream!');
    }

    /* New Sub */
    if (data.type === 'subscription' && !data.event.gifter) {
      const isPrime = (data.event.subPlan === 'Prime');
      const type    = isPrime ? 'primesub' : 'subscribe';
      const suffix  = isPrime ? 'subscribed with Prime!' : 'just subscribed!';
      showAlert(type, data.event.name, suffix);
    }

    /* Resub */
    if (data.type === 'resub') {
      const months = data.event.months || data.event.streak_months || '?';
      showAlert('resub', data.event.name, `resubscribed for ${months} months!`);
    }

    /* Gift Sub */
    if (data.type === 'subscription' && data.event.gifter) {
      const count  = data.event.amount || 1;
      const gifter = data.event.gifter;
      showAlert('giftsub', gifter, `gifted ${count} sub${count > 1 ? 's' : ''}!`);
    }
  });

  /* ── Streamlabs test event (widget editor preview) ────────────────────── */
  window.addEventListener('onWidgetLoad', function(obj) {
    /* fires when editor loads — show a quick follow preview */
    setTimeout(() => showAlert('follow', 'Vyper', 'just followed the stream!'), 800);
  });
</script>

</body>
</html>
